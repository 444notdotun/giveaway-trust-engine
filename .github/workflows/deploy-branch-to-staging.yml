name: Deploy branch to staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and deploy to staging (never used for main -- that goes through ci.yml on merge)"
        required: true
        type: string

concurrency:
  group: deploy-branch-to-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-branch-to-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # workflow_dispatch already requires write access to trigger, but this is an
    # explicit second gate: only the repo owner may use this manual escape hatch,
    # not anyone with write access. A non-owner trigger shows as a skipped job,
    # not a workflow failure.
    if: github.actor == github.repository_owner
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/444notdotun/giveaway-trust-engine
    steps:
      - name: Check out chosen branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Resolve commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate resolved SHA is exactly 40 lowercase hex characters
        run: |
          sha="${{ steps.sha.outputs.sha }}"
          if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "git rev-parse HEAD did not resolve to a 40-character lowercase hex SHA: '$sha'" >&2
            exit 1
          fi

      - name: Build image locally -- NOT pushed yet, content check must pass first
        run: docker build --build-arg COMMIT_SHA="${{ steps.sha.outputs.sha }}" -t "${{ env.IMAGE }}:branch-${{ steps.sha.outputs.sha }}" .

      - name: Export the local image's filesystem for the content check
        run: |
          container_id=$(docker create "${{ env.IMAGE }}:branch-${{ steps.sha.outputs.sha }}")
          docker export "$container_id" -o image.tar
          docker rm "$container_id"
          mkdir -p image-fs
          tar -xf image.tar -C image-fs

      - name: Fail if the image contains .env* or PRD.md anywhere, including inside the jar
        run: |
          found=$(find image-fs \( -iname '.env*' -o -iname 'PRD.md' \) 2>/dev/null)
          if [ -n "$found" ]; then
            echo "Forbidden file(s) found in the image filesystem -- NOT pushed:" >&2
            echo "$found" >&2
            exit 1
          fi

          jar_path=image-fs/app/app.jar
          if [ ! -f "$jar_path" ]; then
            echo "Expected the application jar at $jar_path inside the exported image, but it does not exist" >&2
            exit 1
          fi
          jar_hits=$(unzip -l "$jar_path" | grep -iE '\.env[^/[:space:]]*($|[[:space:]])|PRD\.md($|[[:space:]])' || true)
          if [ -n "$jar_hits" ]; then
            echo "Forbidden entry/entries found inside $jar_path -- NOT pushed:" >&2
            echo "$jar_hits" >&2
            exit 1
          fi

          echo "Confirmed: no .env* or PRD.md in the image filesystem or inside the application jar."

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image (content check passed)
        run: docker push "${{ env.IMAGE }}:branch-${{ steps.sha.outputs.sha }}"

      - name: Trigger staging deploy via Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          imgurl="ghcr.io%2F444notdotun%2Fgiveaway-trust-engine%3Abranch-${{ steps.sha.outputs.sha }}"
          curl -fsS --connect-timeout 10 --max-time 30 -X POST "${DEPLOY_HOOK}&imgURL=${imgurl}"

      - name: Verify staging is running the pushed commit
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL repository variable is not set; cannot verify the deploy" >&2
            exit 1
          fi
          sha="${{ steps.sha.outputs.sha }}"
          deadline=$(( $(date +%s) + 600 ))
          commit=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            commit=$(curl -fsS --max-time 10 "${STAGING_URL}/actuator/info" 2>/dev/null | jq -r '.app.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$sha" ]; then
              echo "Staging confirmed running commit $sha"
              exit 0
            fi
            sleep 15
          done
          echo "Staging did not report commit=$sha within 10 minutes (last seen: '${commit:-<none>}')" >&2
          exit 1
