# Slice 2b: structured JSON logging is the default (application.properties), since that's what
# every real environment (staging, production) and every log-shipping/parsing tool downstream
# expects. This profile exists only to make a developer's own terminal readable while running the
# app locally -- activate with --spring.profiles.active=local-dev. Unsetting the structured format
# property here reverts to Spring Boot's normal plain-text console layout; it does not change any
# other behavior (requestId/MDC/access-log-line logic in RequestIdFilter is unaffected either way).
logging.structured.format.console=
