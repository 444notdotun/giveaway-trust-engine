spring.application.name=giveaway-trust-engine
# statement_timeout (chunk 4 review, item 2; mechanism switched in slice-3-final-fixes item 5):
# bounds EVERY statement on every connection from this pool, set once per physical connection via
# the session-level GUC (not PreparedStatement.setQueryTimeout, which cancels via a separate
# out-of-band connection that's unreliable through a transaction-mode pooler). See
# JdbcStatementTimeoutTest for the proof: a statement blocked on a row lock fails within this
# bound, not indefinitely.
#
# Set via Hikari's connection-init-sql, not a JDBC URL ?options=-c parameter: the URL-parameter
# form is a single string concatenated onto whatever base URL is already in play (Testcontainers'
# getJdbcUrl() already appends its own ?loggerLevel=OFF, for instance), and a second ?-prefixed
# parameter instead of an &-prefixed one silently drops the timeout rather than failing loudly --
# a real failure mode hit while building this slice. connection-init-sql has no string-concatenation
# footgun: Hikari runs it as a plain SQL statement on every new physical connection, independent
# of the URL's own query string.
#
# UNVERIFIED against a real Supabase session pooler: this project has no live Supabase access in
# this environment, so neither mechanism has been exercised against the actual pooler Supabase
# runs in production. Supabase's own docs state the session pooler supports session-level
# statement_timeout, which is what both mechanisms rely on (as opposed to the transaction-mode
# pooler, which does not preserve session state across statements) -- but that claim is unverified
# here and stays unverified until the first staging deploy actually exercises it.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET statement_timeout=5000
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS_ENABLED:false}
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.open-in-view=false
server.port=${PORT:8080}
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.commit=${APP_COMMIT_SHA:unknown}
app.environment=${APP_ENVIRONMENT}
app.bachs.sandbox-base-url=${BACHS_SANDBOX_BASE_URL}
app.bachs.live-base-url=${BACHS_LIVE_BASE_URL}
app.bachs.base-url=${BACHS_BASE_URL}
app.jwt.signing-key=${JWT_SIGNING_KEY}
app.x-oauth.client-id=${X_OAUTH_CLIENT_ID}
app.x-oauth.client-secret=${X_OAUTH_CLIENT_SECRET}
app.x-oauth.redirect-uri=${X_OAUTH_REDIRECT_URI}
app.x-oauth.authorize-url=https://x.com/i/oauth2/authorize
app.x-oauth.token-url=https://api.x.com/2/oauth2/token
app.x-oauth.user-lookup-url=https://api.x.com/2/users/me
app.x-oauth.connect-timeout=2000ms
app.x-oauth.request-timeout=2000ms
app.cookie.path=/
app.cookie.refresh-token-path=/auth/refresh
app.cookie.access-token-max-age=15m
app.cookie.refresh-token-max-age=7d
logging.structured.format.console=ecs

